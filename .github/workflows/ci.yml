name: CI

on:
  push:
    branches: [main, maintenance/unified]
  pull_request:
    branches: [main]

jobs:
  scf-package:
    name: SCF event packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 -m unittest discover -s test -p 'test_package_cloud_ui.py'
      - run: node --check tools/scf/node-probe/index.js
      - run: python3 scripts/package-scf.py
      - uses: actions/upload-artifact@v4
        with:
          name: scf-event-packages
          path: dist/scf/

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race

  browser:
    name: Browser (ordinary + manga)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: git diff --exit-code -- html/tailwind.css html/vendor
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
